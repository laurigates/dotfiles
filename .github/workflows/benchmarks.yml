name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Install dependencies
        run: |
          brew install neovim zsh hyperfine

      - name: Setup mise
        # Installs chezmoi at the version pinned in .mise.toml (#418).
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12

      - name: Assert chezmoi matches the .mise.toml pin
        run: tests/test-ci-pins.sh --assert-installed

      - name: Benchmark chezmoi apply
        id: chezmoi-bench
        run: |
          {
            echo "## ⚡ Chezmoi Apply Performance"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # --source: chezmoi's default source dir (~/.local/share/chezmoi) does
          # not exist on a fresh runner, so a bare `chezmoi apply --dry-run`
          # exits 1 in ~8 ms; the old --ignore-failure hid that and the job
          # recorded the error exit as the apply time (#441). Point it at the
          # checkout, as smoke.yml does.
          # --destination: a scratch dir, so the timing does not depend on what
          # the runner image already has in $HOME.
          # No --ignore-failure: a non-zero apply must fail the job, not be
          # timed. --show-output surfaces chezmoi's error for debugging.
          DEST="$(mktemp -d)"
          trap 'rm -rf "$DEST"' EXIT
          hyperfine --warmup 1 --runs 3 --show-output \
            --export-json chezmoi-bench.json \
            "chezmoi --source \"$GITHUB_WORKSPACE\" --destination \"$DEST\" apply --dry-run"

          # Extract results. hyperfine 1.x keeps the stats at .results[N].mean;
          # 2.x (what brew installs now) nests them under .summary.time_wall_clock
          # and has no top-level .mean, so the old path gave null for every
          # series and gh-pages recorded 0 (#441). Take whichever exists; -e
          # fails the step on an unknown schema instead of recording null.
          MEAN=$(jq -er '.results[0] | (.summary.time_wall_clock // .) | .mean' chezmoi-bench.json)
          STDDEV=$(jq -er '.results[0] | (.summary.time_wall_clock // .) | .stddev' chezmoi-bench.json)

          {
            echo "- **Mean time**: ${MEAN}s"
            echo "- **Std dev**: ${STDDEV}s"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "mean=$MEAN"
            echo "stddev=$STDDEV"
          } >> "$GITHUB_OUTPUT"

      - name: Benchmark shell startup
        id: shell-bench
        run: |
          {
            echo ""
            echo "## 🐚 Shell Startup Performance"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Create minimal zshrc for testing
          cat > /tmp/test.zshrc <<'EOF'
          # Minimal zsh configuration for benchmark
          export ZSH_VERSION_CHECK=1
          EOF

          # Benchmark zsh startup
          hyperfine --warmup 2 --runs 5 --export-json shell-bench.json \
            'zsh -c "exit"' \
            'bash -c "exit"'

          # Extract results (hyperfine 1.x/2.x schema fallback, see the chezmoi
          # step above)
          ZSH_MEAN=$(jq -er '.results[0] | (.summary.time_wall_clock // .) | .mean' shell-bench.json)
          BASH_MEAN=$(jq -er '.results[1] | (.summary.time_wall_clock // .) | .mean' shell-bench.json)

          {
            echo "| Shell | Startup Time |"
            echo "|-------|--------------|"
            echo "| **Zsh** | ${ZSH_MEAN}s |"
            echo "| **Bash** | ${BASH_MEAN}s |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "zsh_mean=$ZSH_MEAN"
            echo "bash_mean=$BASH_MEAN"
          } >> "$GITHUB_OUTPUT"

      - name: Benchmark Neovim startup
        id: nvim-bench
        run: |
          {
            echo ""
            echo "## 📝 Neovim Startup Performance"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Benchmark Neovim startup (headless mode)
          hyperfine --warmup 2 --runs 5 --export-json nvim-bench.json \
            'nvim --headless +quit'

          # hyperfine 1.x/2.x schema fallback, see the chezmoi step above
          NVIM_MEAN=$(jq -er '.results[0] | (.summary.time_wall_clock // .) | .mean' nvim-bench.json)

          echo "- **Mean startup time**: ${NVIM_MEAN}s" >> "$GITHUB_STEP_SUMMARY"

          echo "nvim_mean=$NVIM_MEAN" >> "$GITHUB_OUTPUT"

      - name: Aggregate benchmark results for github-action-benchmark
        run: |
          # hyperfine 1.x/2.x schema fallback, see the chezmoi step above.
          # Assign first: a failing $(...) inside --argjson would not stop the
          # step, and null would be published as a value.
          mean() {
            jq -e --argjson n "$2" '.results[$n] | (.summary.time_wall_clock // .) | .mean' "$1"
          }
          chezmoi_mean=$(mean chezmoi-bench.json 0)
          zsh_mean=$(mean shell-bench.json 0)
          bash_mean=$(mean shell-bench.json 1)
          nvim_mean=$(mean nvim-bench.json 0)

          jq -n \
            --argjson chezmoi "$chezmoi_mean" \
            --argjson zsh "$zsh_mean" \
            --argjson bash "$bash_mean" \
            --argjson nvim "$nvim_mean" \
            '[
              {name: "chezmoi apply --dry-run", unit: "s", value: $chezmoi},
              {name: "zsh startup",              unit: "s", value: $zsh},
              {name: "bash startup",             unit: "s", value: $bash},
              {name: "nvim startup",             unit: "s", value: $nvim}
            ]' > benchmark-results.json
          cat benchmark-results.json

      - name: Store benchmark results
        # github-action-benchmark requires a gh-pages branch that may not exist
        # on forks/PRs. Only run on pushes to main, which matches auto-push.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # v1 is a branch upstream (no v1 tag), so pin the release commit.
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@${{ github.actor }}'

      - name: Create benchmark summary JSON
        run: |
          mkdir -p .github/benchmarks
          cat > .github/benchmarks/results-${{ github.run_id }}.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "benchmarks": {
              "chezmoi_apply": {
                "mean": ${{ steps.chezmoi-bench.outputs.mean }},
                "stddev": ${{ steps.chezmoi-bench.outputs.stddev }}
              },
              "shell_startup": {
                "zsh": ${{ steps.shell-bench.outputs.zsh_mean }},
                "bash": ${{ steps.shell-bench.outputs.bash_mean }}
              },
              "neovim_startup": {
                "mean": ${{ steps.nvim-bench.outputs.nvim_mean }}
              }
            }
          }
          EOF

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            .github/benchmarks/*.json
            *-bench.json
          retention-days: 90

      - name: Compare with previous benchmarks
        if: github.event_name == 'pull_request'
        run: |
          {
            echo ""
            echo "## 📊 Performance Comparison"
            echo ""
            echo "Benchmark results will be compared with the main branch when this PR is merged."
            echo ""
            echo "Current measurements:"
            echo "- Chezmoi apply: ${{ steps.chezmoi-bench.outputs.mean }}s"
            echo "- Shell startup (zsh): ${{ steps.shell-bench.outputs.zsh_mean }}s"
            echo "- Neovim startup: ${{ steps.nvim-bench.outputs.nvim_mean }}s"
          } >> "$GITHUB_STEP_SUMMARY"
