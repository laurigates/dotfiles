name: Smoke Test CI

on:
  push:
    branches: [ main ] # Or your default branch name
  pull_request:
    branches: [ main ] # Or your default branch name

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Checkout and cache only; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Homebrew (Linux)
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install Dependencies
        run: |
          brew install chezmoi
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Validate chezmoi source tree
        # chezmoi verify requires a configured source dir at ~/.local/share/chezmoi
        # and a populated destination; neither exists in a fresh CI env. The Build
        # job runs `chezmoi apply -v` as the real end-to-end check. Here we just
        # confirm templates parse by rendering a trivial one against this repo.
        run: chezmoi execute-template --source=. '{{ .chezmoi.os }}'

  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    needs: [lint] # Run after linters pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew (Linux)
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: /home/linuxbrew/.cache/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install Dependencies
        # Install chezmoi, mise, zsh, and any deps needed *before* chezmoi apply
        run: |
          brew install chezmoi neovim zsh

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.local/state/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('**/.mise.toml', '**/mise.toml', '**/.config/mise/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Run environment health checks
        run: |
          {
            echo "## 🏥 Environment Health Checks"
            echo ""

            # Homebrew doctor
            echo "### Homebrew Doctor"
            if brew doctor 2>&1 | tee brew-doctor.log; then
              echo "✅ Homebrew is healthy"
            else
              echo "⚠️ Homebrew has warnings (non-fatal)"
              echo "\`\`\`"
              cat brew-doctor.log
              echo "\`\`\`"
            fi
            echo ""

            # mise doctor
            echo "### mise Doctor"
            if mise doctor 2>&1 | tee mise-doctor.log; then
              echo "✅ mise is healthy"
            else
              echo "⚠️ mise has warnings"
              echo "\`\`\`"
              cat mise-doctor.log
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run chezmoi apply
        # --source=.: chezmoi defaults to ~/.local/share/chezmoi which doesn't
        # exist on a fresh runner; point it at the workspace checkout.
        # --exclude=scripts: skip run_once_/run_onchange_ scripts. They install
        # brew packages, sync nvim plugins, etc. — stateful work that is
        # meaningful on user machines but not in ephemeral runners.
        run: chezmoi apply -v --source=. --exclude=scripts

      - name: Test zsh shell initialization
        run: |
          # Verify ~/.zshrc sources cleanly. We do NOT check $PROMPT/$PS1 here:
          # the prompt is set by starship (eval "$(starship init zsh)"), which
          # isn't installed in this job — the assertion would always fail. The
          # meaningful smoke test is that sourcing .zshrc doesn't crash zsh.
          #
          # The timeout guards against a HANG (a config change that blocks on
          # input), not against slowness — it is not a perf budget. Keep it
          # generous: the old 10s left no margin and turned normal drift into a
          # red build. Measured cold-runner cost of this step: ~6s on
          # 2026-07-30, ~9s on 2026-08-18 — i.e. 90% of the old budget before
          # any given PR adds anything. A change that pushes real startup time
          # near this limit is a genuine problem worth its own investigation;
          # note that the benchmarks workflow does NOT cover it, because it
          # times a minimal /tmp/test.zshrc rather than the applied ~/.zshrc.
          #
          # `perl -e 'alarm ...; exec @ARGV'` rather than `timeout`: the SIGALRM
          # timer set by alarm(2) survives the exec, so a hang still dies
          # non-zero — identical semantics to `timeout 60s`, minus the GNU
          # coreutils dependency that the macOS job cannot satisfy (#380). Both
          # jobs use the same mechanism so the guard cannot drift per-platform.
          #
          # The `exit 127` tail is NOT optional. perl's exec() returns only on
          # failure, so without it a missing zsh would fall off the end of the
          # one-liner and exit 0 — a green smoke test that sourced nothing.
          # `timeout` reported 127 for that case; this reproduces it.
          perl -e 'alarm shift; exec @ARGV; warn qq(exec: $!\n); exit 127' 60 zsh -c '
            source ~/.zshrc
            if [[ -n "$ZSH_VERSION" ]]; then
              echo "✅ zsh configuration loaded successfully"
            else
              echo "❌ zsh configuration failed to load"
              exit 1
            fi
          '

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [lint] # Run after linters pass, same as the Ubuntu build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-homebrew here: macOS runners ship Homebrew preinstalled.
      # The Linux jobs need the action because linuxbrew is not.
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install Dependencies
        # Deliberately NOT installing zsh. macOS ships zsh 5.9 as /bin/zsh and
        # that is the zsh this repo's config actually targets — see the
        # dot_zfunc/__git_branch_names override, which hooks the completion
        # system zsh 5.9 provides. Installing brew's zsh would smoke-test a
        # different shell than the one on the daily driver.
        run: brew install chezmoi neovim

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.local/state/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('**/.mise.toml', '**/mise.toml', '**/.config/mise/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Run chezmoi apply
        # Same flags as the Ubuntu build: --source=. because chezmoi's default
        # source dir does not exist on a fresh runner, and --exclude=scripts to
        # skip the stateful run_once_/run_onchange_ installers.
        run: chezmoi apply -v --source=. --exclude=scripts

      - name: Test zsh shell initialization
        # Uses the system zsh (/bin/zsh, 5.9) for the reason given above.
        # Same hang-guard rationale as the Ubuntu job — a bound on a config
        # change that blocks on input, not a performance budget. `timeout` is
        # GNU coreutils and is absent from the macOS runner image (as is
        # `gtimeout`, without `brew install coreutils`), so this uses the same
        # perl alarm/exec form as the Ubuntu job — see #380.
        run: |
          perl -e 'alarm shift; exec @ARGV; warn qq(exec: $!\n); exit 127' 60 /bin/zsh -c '
            source ~/.zshrc
            if [[ -n "$ZSH_VERSION" ]]; then
              echo "✅ zsh $ZSH_VERSION configuration loaded successfully"
            else
              echo "❌ zsh configuration failed to load"
              exit 1
            fi
          '
