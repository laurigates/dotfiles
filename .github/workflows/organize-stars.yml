name: Organize GitHub Stars

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      process_all:
        description: 'Process all stars (ignore state)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  organize-stars:
    runs-on: ubuntu-latest

    steps:
      # GH_STAR_TOKEN has never been created, and GITHUB_TOKEN cannot read
      # /user/starred. Until the secret exists, end the run here with a warning
      # instead of a gh auth failure. Later steps check steps.token.
      - name: Check GH_STAR_TOKEN
        id: token
        env:
          GH_STAR_TOKEN: ${{ secrets.GH_STAR_TOKEN }}
        run: |
          if [ -n "$GH_STAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Star organizer skipped: secret GH_STAR_TOKEN is not set on $GITHUB_REPOSITORY."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run star organizer
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_STAR_TOKEN }}
          PROCESS_ALL: ${{ github.event.inputs.process_all || 'false' }}
        run: |
          bash .github/scripts/organize-stars.sh

      - name: Commit state changes
        if: steps.token.outputs.present == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet .github/star-organizer-state.json 2>/dev/null; then
            echo "No state changes to commit"
          else
            git add .github/star-organizer-state.json
            git commit -m "chore(stars): update organization state [skip ci]"
            git push
          fi

      - name: Upload processing log
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-organizer-log-${{ github.run_number }}
          path: /tmp/star-organizer.log
          retention-days: 30
          if-no-files-found: ignore
