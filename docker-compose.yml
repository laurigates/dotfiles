# Docker Compose for local smoke testing
# Reproduces CI environment for faster iteration
#
# Usage (or `just smoke*` / `mise run docker`, which wrap these):
#   docker compose up --build --exit-code-from smoke smoke  # Run full smoke test
#   docker compose run --rm smoke lint     # Run lint stage only
#   docker compose run --rm smoke build    # Run build stage only
#   docker compose run --rm smoke-shell    # Interactive shell for debugging
#
# A plain `docker compose up` exits 0 even when the smoke container fails, so
# the full run needs --exit-code-from for the failure to reach the caller (#441).
# `run` already returns the container's exit code.
#
services:
  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotfiles-smoke
    environment:
      - TERM=xterm-256color
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_ANALYTICS=1

  # Interactive shell for debugging failed tests
  smoke-shell:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotfiles-smoke-shell
    environment:
      - TERM=xterm-256color
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_ANALYTICS=1
    stdin_open: true
    tty: true
    entrypoint: /bin/zsh
