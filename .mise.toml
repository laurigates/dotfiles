# The one chezmoi version for CI (jdx/mise-action), the Docker smoke image, and
# every machine this repo is applied to (private_dot_config/mise/config.toml.tmpl
# reads it with `include ".mise.toml"`). Renovate's mise manager proposes bumps.
# chezmoi skips dot-prefixed files at the source root, so this is never deployed.
# tests/test-ci-pins.sh fails if chezmoi is installed any other way (#418).
[tools]
chezmoi = "2.73.3"
# lint:shell and the smoke Linters job use this shellcheck, so a local run and
# CI report the same findings.
shellcheck = "0.11.0"

# ============================================================================
# Tasks for working in this repo
# ============================================================================
# These live here, not in the global mise config, because a task runs in the
# root of the config that defines it: global tasks run in $HOME, these run in
# the checkout or worktree holding this file, from any subdirectory (#398).
# The global config keeps only tasks that do not read the repo.
#
# Keep mise templates out of this file: with only [tools] version strings and
# template-free [tasks], mise reads it without `mise trust`.
#
# tests/test-mise-tasks.sh checks where each task runs, and that every lint
# task fails on a planted finding and on a missing or broken linter.

# ----------------------------------------------------------------------------
# Dotfiles management
# ----------------------------------------------------------------------------
# chezmoi's source dir is pinned in ~/.config/chezmoi/chezmoi.toml and only
# --source overrides it, so a bare `chezmoi apply` in a worktree applies the
# main checkout. $PWD is the root of the checkout running the task (#397).
[tasks.apply]
description = "Apply this checkout's dotfiles to the system"
run = 'chezmoi --source "$PWD" apply -v'

[tasks.diff]
description = "Show differences between this checkout and the system"
run = 'chezmoi --source "$PWD" diff'

# `check` is an alias here, not a task of its own: a [tasks.check] with only
# `alias = "status"` defines an empty task named check that runs nothing, so
# `mise run check` and qa's dependency on it both passed without checking (#439).
[tasks.status]
alias = "check"
description = "Show status of this checkout vs current system state"
run = 'chezmoi --source "$PWD" status'

[tasks.verify]
description = "Verify the system matches this checkout"
run = 'chezmoi --source "$PWD" verify'

[tasks.edit]
description = "Edit dotfiles configuration"
run = """
#!/usr/bin/env bash
if command -v nvim >/dev/null 2>&1; then
    nvim .
elif command -v code >/dev/null 2>&1; then
    code .
else
    echo "⚠️  No preferred editor found, please edit manually"
fi
"""

# ----------------------------------------------------------------------------
# Testing & quality assurance
# ----------------------------------------------------------------------------
[tasks.test]
description = "Run all tests (linting + setup verification + plugin refs + context budget + container testing)"
depends = ["lint", "test:setup", "test:plugin-refs", "test:context-budget", "test:shell-precedence", "test:ci-pins", "test:mise-tasks", "test:pi-settings", "test:gh-completion", "test:chezmoi-exact-guard", "test:chezmoi-root-meta", "test:organize-stars", "test:cloud-env", "test:reclaim", "docker"]

[tasks."test:setup"]
description = "Test initial setup script handles missing commands gracefully (Issue #128)"
run = "tests/test-initial-setup.sh"

[tasks."test:plugin-refs"]
description = "Regression test: Claude plugin/marketplace references resolve (alias, plugin existence, slash commands)"
run = "tests/test-claude-plugin-references.sh"

[tasks."test:context-budget"]
description = "Regression test: always-loaded Claude global context stays within budget (size, repo-specific markers, frontmatter)"
run = "tests/test-claude-context-budget.sh"

[tasks."test:shell-precedence"]
description = "Regression test: interactive-shell lookup order (PATH mise > brew > system; fpath ~/.zfunc > zsh > brew)"
run = "tests/test-shell-precedence.sh"

[tasks."test:ci-pins"]
description = "Regression test: CI toolchain pins (no branch-ref actions, chezmoi only from .mise.toml, mise-action version pinned, Python/bun/pre-commit/Claude Code CLI exact)"
run = "tests/test-ci-pins.sh --self-test && tests/test-ci-pins.sh"

[tasks."test:cloud-env"]
description = "Regression test: cloud-env check/bootstrap exit non-zero on every gap (chezmoi source, settings, marketplace, plugins, commands) and bootstrap is idempotent"
run = "tests/test-cloud-env.sh"

[tasks."test:pi-settings"]
description = "Regression test: ~/.pi/agent/settings.json modify_ script keeps pi-owned keys and unions packages by identity"
run = "tests/test-pi-settings-modify.sh"

[tasks."test:chezmoi-root-meta"]
description = "Regression test: no repo-meta file at the source root is applied to $HOME (#442)"
run = "tests/test-chezmoi-root-meta.sh"

[tasks."test:gh-completion"]
description = "Regression test: `gh pr <sub> <TAB>` completes PR numbers and still delegates to gh's own completion"
run = "tests/test-gh-completion.sh"

[tasks."test:chezmoi-exact-guard"]
description = "Regression test: the chezmoi-exact-guard hook blocks a deleting apply wrapped in bash -c / sh -c and lets prose through"
run = "tests/test-chezmoi-exact-guard.sh"

[tasks."test:mise-tasks"]
description = "Regression test: repo tasks run in the checkout, and lint tasks fail on findings and on a broken linter (#398)"
run = "tests/test-mise-tasks.sh"

[tasks."test:organize-stars"]
description = "Regression test: organize-stars.sh exits non-zero when gh fails, and its counters do not abort the run (#443)"
run = "tests/test-organize-stars.sh"

[tasks."test:reclaim"]
description = "Regression test: reclaim.sh runs on Linux and macOS, reads dir mtimes on both, and prunes all brew downloads and the npx cache"
run = "tests/test-reclaim.sh"

# Every linter runs even after one fails; the task fails if any did.
[tasks.lint]
description = "Run all linters (shell, lua, actions, docs)"
run = "mise run --continue-on-error --jobs 1 lint:shell ::: lint:lua ::: lint:actions ::: lint:docs"

# Each lint task first runs its linter's --version, so a missing or broken
# linter fails the task instead of letting it pass having checked nothing.
[tasks."lint:shell"]
description = "Run shellcheck on every tracked *.sh file"
run = """
#!/usr/bin/env bash
set -euo pipefail
shellcheck --version >/dev/null || { echo "lint:shell: shellcheck is missing or cannot run" >&2; exit 1; }
git ls-files --error-unmatch '*.sh' >/dev/null
git ls-files -z '*.sh' | xargs -0 shellcheck
"""

[tasks."lint:lua"]
description = "Run luacheck on Neovim configuration"
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! luacheck --version >/dev/null; then
    echo "lint:lua: luacheck is missing or cannot run" >&2
    echo "  Homebrew's luacheck 1.2.0 crashes on Lua 5.5 (lunarmodules/luacheck#147, fixed on master, not released)." >&2
    echo "  Use a luacheck that runs on Lua 5.4 instead:" >&2
    echo "    any OS: luarocks install --dev luacheck" >&2
    echo "    Linux:  mise install github:lunarmodules/luacheck@1.2.0, then put it on PATH:" >&2
    echo '            ln -s "$(mise where github:lunarmodules/luacheck@1.2.0)/luacheck" ~/.local/bin/luacheck' >&2
    echo "            (a one-off run: mise x github:lunarmodules/luacheck@1.2.0 -- luacheck private_dot_config/nvim/lua)" >&2
    exit 1
fi
luacheck private_dot_config/nvim/lua
"""

[tasks."lint:actions"]
description = "Run actionlint on GitHub Actions workflows"
run = """
#!/usr/bin/env bash
set -euo pipefail
actionlint --version >/dev/null || { echo "lint:actions: actionlint is missing or cannot run" >&2; exit 1; }
actionlint
"""

[tasks."lint:docs"]
description = "Check docs for dangling repo-relative references (scripts/paths/links)"
run = """
#!/usr/bin/env bash
set -euo pipefail
python3 --version >/dev/null || { echo "lint:docs: python3 is missing or cannot run" >&2; exit 1; }
python3 scripts/check-doc-references.py --strict
"""

[tasks.docker]
description = "Test full environment using Docker Compose"
run = """
#!/usr/bin/env bash
if [ -f docker-compose.yml ]; then
    # A plain `up` exits 0 even when the smoke container fails (#441);
    # --exit-code-from hands the container's exit code to this task.
    docker compose up --build --exit-code-from smoke smoke
else
    echo "❌ Error: docker-compose.yml not found"
    exit 1
fi
"""

[tasks.qa]
description = "Run quality assurance checks"
depends = ["lint", "check"]

[tasks.ci]
description = "Run CI checks locally"
depends = ["lint"]

# ----------------------------------------------------------------------------
# Cleanup
# ----------------------------------------------------------------------------
# The finds skip .git and other worktrees under .claude/worktrees. They use
# -not -path, not -prune: -delete implies -depth, which disables -prune.
[tasks.clean]
description = "Clean up temporary files and caches"
run = """
#!/usr/bin/env bash
set -euo pipefail

echo "🧹 Cleaning up..."

# Homebrew cache
if command -v brew >/dev/null 2>&1; then
    echo "  🍺 Cleaning Homebrew cache..."
    brew cleanup
fi

# mise unused versions
if command -v mise >/dev/null 2>&1; then
    echo "  🛠️  Pruning unused mise versions..."
    mise prune
fi

# Temporary files in this checkout
echo "  🗑️  Removing temporary files..."
find . -name "*.tmp" -not -path "./.git/*" -not -path "./.claude/worktrees/*" -delete 2>/dev/null || true
find . -name ".DS_Store" -not -path "./.git/*" -not -path "./.claude/worktrees/*" -delete 2>/dev/null || true

echo "✅ Cleanup complete!"
"""

# ----------------------------------------------------------------------------
# Security
# ----------------------------------------------------------------------------
# gitleaks is the only secret check. security:audit used to run a keyword grep
# first (`rg -i "password|secret|token|key"`) that matched about a thousand lines, every
# variable that merely has such a name, and printed them with exit 0: its
# "no obvious secrets" branch ran only when nothing matched, so the step could
# not fail. gitleaks' rules plus the .gitleaks.toml allowlist tell a secret from
# a name; --verbose names the file and rule of a leak, --redact keeps the secret
# out of the log. A missing gitleaks fails instead of warning (#439).
[tasks."security:scan"]
description = "Scan the working tree for secrets with gitleaks (fails on a leak or a missing gitleaks)"
run = """
#!/usr/bin/env bash
set -euo pipefail
gitleaks version >/dev/null || { echo "security:scan: gitleaks is missing or cannot run" >&2; exit 1; }
gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose
"""

[tasks."security:audit"]
description = "Run security audit on configurations (the gitleaks scan)"
depends = ["security:scan"]
